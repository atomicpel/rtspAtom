# Конфигурация MediaMTX для RTSP Atom (проверена с MediaMTX v1.21.2).
# Новые версии MediaMTX могут добавлять серверы, включённые по умолчанию, —
# при обновлении MediaMTX сверяйтесь с mediamtx.default.yml из пакета.
# Все порты слушаются только на 127.0.0.1: камеры забирает MediaMTX,
# а браузеры получают видео через панель (порт 8080) с проверкой прав.
# Пути (камеры) панель добавляет сама через API — вручную их сюда не пишут.

logLevel: info
logDestinations: [stdout]

# Управляющий API — им пользуется панель.
api: yes
apiAddress: 127.0.0.1:9997

metrics: no
pprof: no
playback: no

# Собственные серверы протоколов не нужны: MediaMTX только забирает
# видео с камер и отдаёт его по HLS панели.
rtsp: no
rtmp: no
webrtc: no
srt: no
moq: no

hls: yes
hlsAddress: 127.0.0.1:8888
# Держать HLS готовым, чтобы видеостена открывалась без задержки.
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

paths: {}
